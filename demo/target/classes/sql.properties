# 1. 簡易抽出（通常クエリ）// ** ?は置き換え文字です。.javaの方で指定します。末尾の \　は改行後もSQLが続くということを明示します。
batch.shipping.select.simple=\
    SELECT d.shipping_id, d.col_01, d.col_02 \
    FROM T_DETAIL_LOG d \
    INNER JOIN M_TRANSIT_ROUTE r ON d.route_id = r.route_id \
    WHERE r.is_active = ? AND d.status = ?


# 2. 詳細集計・JOIN抽出（Reader用）# // ** 配送データ取得用SQL（JOIN・GROUP BY・大量列を含む）現場ではこんな感じのSQLが使われます。
batch.shipping.select.detail=\
    SELECT \
        s.shipping_id, \
        s.col_01, s.col_02, s.col_03, s.col_04, s.col_05, \
        s.col_06, s.col_07, s.col_08, s.col_09, s.col_10, \
        s.col_11, s.col_12, s.col_13, s.col_14, s.col_15, \
        s.col_16, s.col_17, s.col_18, s.col_19, s.col_20 \
    FROM T_DETAIL_LOG s \
    INNER JOIN ( \
        SELECT \
            d.shipping_id \
        FROM T_DETAIL_LOG d \
        INNER JOIN M_TRANSIT_ROUTE r ON d.route_id = r.route_id \
        WHERE r.is_active = ? \
        GROUP BY d.shipping_id \
        HAVING COUNT(*) > 0 \
    ) m ON s.shipping_id = m.shipping_id

# 3. 結果登録（Writer用）
batch.shipping.insert.result=\
    INSERT INTO T_SHIPPING_RESULT  \
        (shipping_id, result_col_01, updated_at)  \
        VALUES  \
        (?, ?, CURRENT_TIMESTAMP)